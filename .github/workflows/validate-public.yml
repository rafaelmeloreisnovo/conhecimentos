name: public-device-evidence-contract
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - name: Adversarial envelope tests
        run: python3 -I -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inspect only explicitly published sanitized envelopes
        run: python3 -I -B scripts/validate_proofs.py
      - name: Claim boundary
        run: echo "CI_SCHEMA_PASS != DEVICE_EXECUTION_PROOF; never upload public evidence by default"
